name: Build and verify UO Memento
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memento-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m unittest discover -s tests -v
      - run: bash scripts/check-input.sh
      - run: bash scripts/check-logs.sh
      - run: bash scripts/check-client-readiness.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify launcher layout options in Chromium
        run: |
          npm install --prefix runtime-work/ui --ignore-scripts --no-audit --no-fund playwright@1.62.1
          NODE_PATH="$PWD/runtime-work/ui/node_modules" CHROME_PATH=/usr/bin/google-chrome node tests/ui.cjs
      - name: Compile the real Memento server and game scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mono-devel libgdiplus
          git clone https://github.com/Russianranger/ultima-memento.git runtime-work/memento
          git -C runtime-work/memento checkout 916d1ec666376ef44366c986befa3200deb93eb0
          python3 tests/verify_server_compile.py runtime-work/memento > runtime-work/server-compile.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-verification
          path: runtime-work/server-compile.log
  dotnet-wine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install headless Wine test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libfreetype6 libfontconfig1 gcc-mingw-w64-x86-64 mesa-vulkan-drivers libvulkan1
      - name: Reproduce managed loader and client configuration failures
        run: bash scripts/check-dotnet-wine.sh
      - name: Exercise real TazUO FNA3D and SDL Vulkan resource lifetime
        run: bash scripts/check-graphics-wine.sh
      - name: Reproduce FNA nested paint and verify serialized redraws
        run: bash scripts/check-paint-wine.sh
      - name: Verify render instrumentation and exception propagation
        run: bash scripts/check-render-trace.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-wine-verification
          path: |
            runtime-work/dotnet-wine/logs/
            runtime-work/sdl-probe/logs/
            runtime-work/fna-paint/logs/
            runtime-work/render-probe/logs/
  box64-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install translator test toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake build-essential python3 gcc-x86-64-linux-gnu libc6-dev-amd64-cross
      - name: Exercise modified-code returns through pinned Box64 on ARM64
        run: bash scripts/check-box64-arm64.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box64-return-verification
          path: runtime-work/box64-return/logs/
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MEMENTO_PREVIEW_KEYSTORE: ${{ github.workspace }}/runtime-work/signing/preview.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: bash scripts/build-diagnostics.sh
      - run: python3 scripts/prepare-assets.py
      - uses: actions/cache@v4
        id: signing
        if: github.ref == 'refs/heads/main'
        with:
          path: runtime-work/signing/preview.keystore
          key: memento-recovery-signing-v1
      - name: Check whether recovery signing has an existing anchor
        id: anchor
        if: github.ref == 'refs/heads/main'
        run: |
          status=$(curl -sS --retry 3 -o runtime-work/recovery-release.json -w '%{http_code}' https://api.github.com/repos/Russianranger/uo-android-launcher/releases/tags/v0.1.1)
          case "$status" in
            200) echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Cannot verify existing release: HTTP $status" >&2; exit 1 ;;
          esac
      - name: Prepare the explicit recovery preview key
        env:
          GH_TOKEN: ${{ github.token }}
          MEMENTO_SIGNING_KEYSTORE_BASE64: ${{ secrets.MEMENTO_SIGNING_KEYSTORE_BASE64 }}
          RECOVERY_RELEASE_EXISTS: ${{ steps.anchor.outputs.exists }}
        run: |
          mkdir -p "$(dirname "$MEMENTO_PREVIEW_KEYSTORE")"
          if [ -n "$MEMENTO_SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$MEMENTO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$MEMENTO_PREVIEW_KEYSTORE"
          elif [ ! -f "$MEMENTO_PREVIEW_KEYSTORE" ]; then
            if [ "$RECOVERY_RELEASE_EXISTS" = true ]; then
              echo 'Recovery signing key is unavailable; restore it before publishing another update.' >&2
              exit 1
            fi
            keytool -genkeypair -keystore "$MEMENTO_PREVIEW_KEYSTORE" -storetype JKS -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=UO Memento Recovery Preview'
          fi
          chmod 600 "$MEMENTO_PREVIEW_KEYSTORE"
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify deployed client imports from the built APK
        run: bash scripts/check-client-assets.sh
      - name: Verify recovery identity and signature
        run: |
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > runtime-work/update-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > runtime-work/badging.txt
          grep -q "package: name='io.github.russianranger.uomemento.recovery'" runtime-work/badging.txt
          unzip -l app/build/outputs/apk/debug/app-debug.apk > runtime-work/apk-files.txt
          grep -q assets/Memento.Diagnostics.dll runtime-work/apk-files.txt
          grep -q "versionCode='16'" runtime-work/badging.txt
      - name: Keep the recovery certificate stable after its first release
        if: github.ref == 'refs/heads/main' && steps.anchor.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.1 --pattern UO-Memento-0.1.1-Recovery.apk --dir runtime-work/anchor
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs runtime-work/anchor/UO-Memento-0.1.1-Recovery.apk > runtime-work/previous-cert.txt
          previous=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' runtime-work/previous-cert.txt)
          update=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' runtime-work/update-cert.txt)
          test -n "$previous" && test "$previous" = "$update"
      - uses: actions/upload-artifact@v4
        with:
          name: uo-memento-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            runtime-work/downloads/runtime-bridges.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: app/build/reports/
  release:
    if: github.ref == 'refs/heads/main'
    needs: [verify, apk, dotnet-wine, box64-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uo-memento-apk
          path: dist
      - name: Preserve corresponding sources and publish the test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/app/build/outputs/apk/debug/app-debug.apk dist/UO-Memento-0.2.0-Recovery.apk
          mv dist/runtime-work/downloads/runtime-bridges.zip dist/runtime-bridges.zip
          curl -fL --retry 3 https://github.com/Russianranger/uo-android-launcher/releases/download/v0.1.0/runtime-corresponding-sources.tar.gz -o dist/runtime-corresponding-sources.tar.gz
          echo '492043660b1370e1910c8b8ca2b93be1f637f4929034f575591f14e67e015243  dist/runtime-corresponding-sources.tar.gz' | sha256sum --check
          cp scripts/recover-preview.py dist/recover-preview.py
          git archive --format=zip --output=dist/UO-Memento-0.2.0-source.zip HEAD
          (cd dist && sha256sum UO-Memento-0.2.0-Recovery.apk UO-Memento-0.2.0-source.zip runtime-bridges.zip runtime-corresponding-sources.tar.gz recover-preview.py) > dist/SHA256SUMS.txt
          if ! gh release view v0.2.0 >/dev/null 2>&1; then
            gh release create v0.2.0 --target "$GITHUB_SHA" --prerelease --title 'UO Memento 0.2.0 — Native Wine and FEX preview' --notes-file docs/RELEASE-NOTES.md
          fi
          gh release upload v0.2.0 dist/UO-Memento-0.2.0-Recovery.apk dist/UO-Memento-0.2.0-source.zip dist/runtime-bridges.zip dist/runtime-corresponding-sources.tar.gz dist/SHA256SUMS.txt dist/recover-preview.py --clobber
