plugins { id 'com.android.application' }
android {
    namespace 'io.github.russianranger.trasc'
    buildFeatures { buildConfig true }
    compileSdk 35
    defaultConfig {
        // Separate identity preserves the original installation after its CI key was lost.
        applicationId 'io.github.russianranger.uomemento.recovery'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '0.2.8'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes { release { minifyEnabled false } }
    if (System.getenv('MEMENTO_PREVIEW_KEYSTORE')) {
        signingConfigs.debug {
            storeFile file(System.getenv('MEMENTO_PREVIEW_KEYSTORE'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libproot.so', '**/libproot-loader.so'] } }
    sourceSets { main { assets.srcDir '../backend-assets' } }
}
tasks.register('prepareBackend', Copy) { from '../backend'; include '*.py', '*.cs', '*.b64'; into '../backend-assets' }
tasks.named('preBuild').configure { dependsOn 'prepareBackend' }
